name: seamkit readback
description: Proves each merged change is live in production after a deploy, and reports the verdict as a check run.
author: azank1
branding:
  icon: check-circle
  color: blue

# Runs on GitHub-hosted runners, and on self-hosted runners that support the node24 runtime.
inputs:
  url:
    description: >-
      The production address to read back, such as https://your.app. Its version document is looked for at
      /version.json, /api/version and /version.
    required: true
  last:
    description: >-
      How many of the latest changes on the default branch to examine. After a deploy, changes merged after the
      deployed commit that production does not show yet are listed as not examined and left to the next deploy.
    default: '20'
  pr:
    description: Read back one merged pull request by number instead of the latest changes.
    default: ''
  branch:
    description: >-
      The branch changes are merged into. Defaults to the repository's default branch, as the event names it. A bare
      name such as production also finds origin/production. It does not change which commit counts as deployed.
    default: ''
  version-url:
    description: Where production's version document is, when it is not at one of the usual paths.
    default: ''
  wait:
    description: >-
      After a deploy, seconds (0 to 1800) to keep reading production while it does not run a version containing the
      deployed commit yet. Reading stops as soon as it does, and nothing is recorded while waiting. Without a deployed
      commit, as on a schedule, there is nothing to wait for.
    default: '60'
  ledger:
    description: >-
      auto records the verdict when a seamkit/state branch exists here or on the remote; true creates one when there
      is none; false never records. Recording pushes with the checkout's credentials, so it needs contents write and
      actions/checkout's default persist-credentials.
    default: auto
  check-name:
    description: The check run's name. Defaults to "seamkit readback (<host>)", so each production address gets its own check.
    default: ''
  sha:
    description: >-
      The deployed commit. The check run goes on it, and a change merged after it is left to the next deploy unless an
      earlier run saw it live. Defaults to the deployed commit for deployment_status and the other workflow's commit
      for workflow_run. For other events nothing counts as deployed, and the check goes on the job's commit, or a pull
      request's head commit.
    default: ''
  token:
    description: Token for posting the check run, which needs checks write.
    default: ${{ github.token }}

outputs:
  outcome:
    description: pass, fail, examined_nothing, unclassified, error (no verdict was produced) or skipped (the deploy had not succeeded).
  exit-code:
    description: seamkit's exit code. 0 pass, 1 fail, 2 no verdict, 3 examined nothing, 4 unclassified.
  title:
    description: 'The one-line result, such as "PASS: 20 live of 20".'
  check-run-url:
    description: The posted check run, when GitHub accepted it.

runs:
  using: node24
  main: packages/action/bundle/index.js
