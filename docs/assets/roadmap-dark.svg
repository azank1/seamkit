<svg xmlns="http://www.w3.org/2000/svg" width="920" height="686" viewBox="0 0 920 686" role="img" aria-labelledby="t d">
<title id="t">seamkit levels</title>
<desc id="d">A level map of seamkit. Level 1, The CLI, is shipped: npm 0.1.0, 2026-10-19. Level 2, The Action, is a release candidate: 0.2.0, proven on real Vercel deploys. Levels 3 to 7 are locked and planned, with no dates: MCP server, Carry, The gate, Approvals, Blast radius.</desc>
<style>
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif}
.mono{font-family:ui-monospace, 'SFMono-Regular', 'SF Mono', Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace}
.pulse{opacity:0}
@media (prefers-reduced-motion: no-preference){
.fill{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both}
.fill.later{animation-delay:.45s}
.pulse{transform-box:fill-box;transform-origin:50% 50%;animation:pulse 6s ease-out 1.4s infinite}
}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pulse{0%{opacity:.9;transform:scale(1)}22%{opacity:0;transform:scale(1.75)}100%{opacity:0;transform:scale(1.75)}}
</style>
