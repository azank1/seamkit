<svg xmlns="http://www.w3.org/2000/svg" width="920" height="758" viewBox="0 0 920 758" role="img" aria-labelledby="t d">
<title id="t">seamkit trophy case</title>
<desc id="d">Six unlocked trophies: On npm, 2026-10-19, seamkit@0.1.0 published. First real deploy, 2026-10-25, the Action read back a real Vercel deploy. Caught a rollback, 2026-10-26, the watch reported a real vercel rollback as NOT LIVE. Replays byte for byte, 2026-10-26, the ledger replayed 5 of 5. 185 fixes broken on purpose, 30 review rounds, each fix mutation-tested. Zero network in tests, 288 tests, an egress guard blocks any outside socket. Three locked trophies open to anyone: first outside field report, first surviving mutant found, first outside contributor.</desc>
