<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d"><title id="t">seamkit</title><desc id="d">The seamkit wordmark with the question: is your merged change actually live? A terminal runs npx seamkit audit and answers LIVE 5 of 6, FAIL, exit code 1. Beside it, two panels of cloth labelled merged and live are stitched together, one stitch per pull request: 12, 13, 14, 15 and 17 are live, and 16 is not live, where the seam stays open.</desc><style>.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif}.m{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace}.st0{animation:st0 9s linear infinite}@keyframes st0{0%,13.3%{opacity:0}16.1%,94%{opacity:1}100%{opacity:0}}.st1{animation:st1 9s linear infinite}@keyframes st1{0%,21.7%{opacity:0}24.4%,94%{opacity:1}100%{opacity:0}}.st2{animation:st2 9s linear infinite}@keyframes st2{0%,30%{opacity:0}32.8%,94%{opacity:1}100%{opacity:0}}.st3{animation:st3 9s linear infinite}@keyframes st3{0%,38.3%{opacity:0}41.1%,94%{opacity:1}100%{opacity:0}}.st4{animation:st4 9s linear infinite}@keyframes st4{0%,46.7%{opacity:0}49.4%,94%{opacity:1}100%{opacity:0}}.st5{animation:st5 9s linear infinite}@keyframes st5{0%,55%{opacity:0}57.8%,94%{opacity:1}100%{opacity:0}}.needle{animation:needle 9s linear infinite}@keyframes needle{0%,11.1%{transform:translateY(0);opacity:0}13.3%{opacity:1}63.3%{transform:translateY(300px);opacity:1}74.4%,100%{transform:translateY(300px);opacity:0}}.typing{animation:typing 9s steps(40) infinite;transform-box:fill-box;transform-origin:left}@keyframes typing{0%{transform:scaleX(0)}13.3%,100%{transform:scaleX(1)}}.answer{animation:answer 9s linear infinite}@keyframes answer{0%,63.3%{opacity:0}67.8%,94%{opacity:1}100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.needle{opacity:0}}</style><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1622"/><stop offset="1" stop-color="#101f33"/></linearGradient>
<linearGradient id="word" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#9db8ff"/></linearGradient>
<pattern id="weaveL" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#17263a"/><rect width="12" height="1.2" fill="#22364f"/></pattern>
<pattern id="weaveR" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="12" height="12" fill="#143026"/><rect width="12" height="1.2" fill="#1d4536"/></pattern>
<clipPath id="card"><rect width="1280" height="420" rx="20"/></clipPath>
</defs><g clip-path="url(#card)"><rect width="1280" height="420" fill="url(#bg)"/><path d="M690,0 H923 V420 H640 Z" fill="url(#weaveL)"/><path d="M937,0 H1280 V420 H937 Z" fill="url(#weaveR)"/><rect x="923" y="0" width="14" height="420" fill="#070c13"/><text class="m" x="904" y="36" font-size="15" fill="#8fa9d8" text-anchor="end" letter-spacing="2">MERGED</text><text class="m" x="956" y="36" font-size="15" fill="#7fd3ac" letter-spacing="2">LIVE</text><g class="st0"><rect x="778" y="69" width="64" height="30" rx="7" fill="#0c1622" stroke="#34507a"/><text class="m" x="810" y="89" font-size="15" font-weight="700" fill="#dbe6ff" text-anchor="middle">#12</text><path d="M850,84 C890,72 970,96 1010,84" fill="none" stroke="#f2f5fa" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 9"/><circle cx="1042" cy="84" r="13" fill="#2fbf7f"/><path d="M1035,84 l5,5 l9,-10" fill="none" stroke="#06200f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1066" y="89" font-size="14" fill="#9fe3c2">live</text></g><g class="st1"><rect x="778" y="119" width="64" height="30" rx="7" fill="#0c1622" stroke="#34507a"/><text class="m" x="810" y="139" font-size="15" font-weight="700" fill="#dbe6ff" text-anchor="middle">#13</text><path d="M850,134 C890,122 970,146 1010,134" fill="none" stroke="#f2f5fa" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 9"/><circle cx="1042" cy="134" r="13" fill="#2fbf7f"/><path d="M1035,134 l5,5 l9,-10" fill="none" stroke="#06200f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1066" y="139" font-size="14" fill="#9fe3c2">live</text></g><g class="st2"><rect x="778" y="169" width="64" height="30" rx="7" fill="#0c1622" stroke="#34507a"/><text class="m" x="810" y="189" font-size="15" font-weight="700" fill="#dbe6ff" text-anchor="middle">#14</text><path d="M850,184 C890,172 970,196 1010,184" fill="none" stroke="#f2f5fa" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 9"/><circle cx="1042" cy="184" r="13" fill="#2fbf7f"/><path d="M1035,184 l5,5 l9,-10" fill="none" stroke="#06200f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1066" y="189" font-size="14" fill="#9fe3c2">live</text></g><g class="st3"><rect x="778" y="219" width="64" height="30" rx="7" fill="#0c1622" stroke="#34507a"/><text class="m" x="810" y="239" font-size="15" font-weight="700" fill="#dbe6ff" text-anchor="middle">#15</text><path d="M850,234 C890,222 970,246 1010,234" fill="none" stroke="#f2f5fa" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 9"/><circle cx="1042" cy="234" r="13" fill="#2fbf7f"/><path d="M1035,234 l5,5 l9,-10" fill="none" stroke="#06200f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1066" y="239" font-size="14" fill="#9fe3c2">live</text></g><g class="st4"><rect x="778" y="269" width="64" height="30" rx="7" fill="#0c1622" stroke="#34507a"/><text class="m" x="810" y="289" font-size="15" font-weight="700" fill="#dbe6ff" text-anchor="middle">#16</text><path d="M850,284 h44" fill="none" stroke="#ff7b6e" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 9"/><circle cx="1042" cy="284" r="13" fill="#ff7b6e"/><path d="M1036,278 l12,12 m0,-12 l-12,12" fill="none" stroke="#2a0b08" stroke-width="3.2" stroke-linecap="round"/><text class="m" x="1066" y="289" font-size="14" fill="#ffb1a8">not live</text></g><g class="st5"><rect x="778" y="319" width="64" height="30" rx="7" fill="#0c1622" stroke="#34507a"/><text class="m" x="810" y="339" font-size="15" font-weight="700" fill="#dbe6ff" text-anchor="middle">#17</text><path d="M850,334 C890,322 970,346 1010,334" fill="none" stroke="#f2f5fa" stroke-width="4" stroke-linecap="round" stroke-dasharray="14 9"/><circle cx="1042" cy="334" r="13" fill="#2fbf7f"/><path d="M1035,334 l5,5 l9,-10" fill="none" stroke="#06200f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text class="m" x="1066" y="339" font-size="14" fill="#9fe3c2">live</text></g><g class="needle"><path d="M930,36 l5,34 l-5,14 l-5,-14 z" fill="#dfe7f2"/><circle cx="930" cy="48" r="2.4" fill="#0c1622"/></g><g transform="translate(70,0)"><g transform="translate(0,84)"><rect width="44" height="44" rx="11" fill="#2752c9"/><path d="M15,8 V36 M29,8 V36" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round"/><path d="M15,14 H29 M15,22 H29 M15,30 H29" stroke="#ffd66b" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 3"/></g><text class="s" x="60" y="124" font-size="64" font-weight="800" fill="url(#word)" letter-spacing="-1.5">seamkit</text><text class="s" x="0" y="184" font-size="27" font-weight="600" fill="#e8eef5">Is your merged change actually live?</text><text class="s" x="0" y="218" font-size="18" fill="#93a6b9">Deterministic production checks for teams whose code is written by agents.</text><g transform="translate(0,252)"><rect width="560" height="104" rx="12" fill="#070c13" stroke="#22364f"/><circle cx="20" cy="18" r="5" fill="#ff7b6e"/><circle cx="38" cy="18" r="5" fill="#e9b752"/><circle cx="56" cy="18" r="5" fill="#46d394"/><text class="m" x="20" y="54" font-size="17" fill="#6f98ff">$</text><clipPath id="type"><rect class="typing" x="38" y="34" width="418" height="28"/></clipPath><text class="m" x="40" y="54" font-size="17" fill="#e8eef5" clip-path="url(#type)">npx seamkit audit --url https://your.app</text><g class="answer"><text class="m" x="20" y="86" font-size="17"><tspan fill="#46d394" font-weight="700">LIVE 5 of 6</tspan><tspan fill="#93a6b9">  ·  </tspan><tspan fill="#ff7b6e" font-weight="700">FAIL</tspan><tspan fill="#93a6b9">  ·  exit code </tspan><tspan fill="#ffffff" font-weight="700">1</tspan></text></g></g></g></g></svg>
