ill="#616e7a" /><polygon points="829.3,631.6 833.4,634 829.3,636.4 825.1,634" fill="#93a6b9" /><polygon points="809.9,626.8 848.7,649.2 848.7,630 809.9,607.6" fill="#304258" /><polygon points="852.8,646.8 848.7,649.2 848.7,630 852.8,627.6" fill="#263547" /><polygon points="814,605.2 852.8,627.6 848.7,630 809.9,607.6" fill="#3a516b" /><text class="m" transform="matrix(0.866,0.5,0,1,812.6,622)" font-size="8.4" font-weight="700" fill="#e8eef5">/version</text><text class="s" x="41.900000000000006" y="434" font-size="17" font-weight="700" fill="#e8eef5" text-anchor="start">Your repository</text><text class="s" x="41.900000000000006" y="453" font-size="13.5" fill="#93a6b9" text-anchor="start">merged pull requests on main,</text><text class="s" x="41.900000000000006" y="470" font-size="13.5" fill="#93a6b9" text-anchor="start">each with an optional seamkit-card</text><text class="s" x="409.1" y="592" font-size="17" font-weight="700" fill="#e8eef5" text-anchor="start">Build</text><text class="s" x="409.1" y="611" font-size="13.5" fill="#93a6b9" text-anchor="start">seamkit stamp writes the commit</text><text class="s" x="409.1" y="628" font-size="13.5" fill="#93a6b9" text-anchor="start">into version.json</text><text class="s" x="613.6" y="418" font-size="17" font-weight="700" fill="#e8eef5" text-anchor="start">The seam</text><text class="s" x="613.6" y="437" font-size="13.5" fill="#93a6b9" text-anchor="start">a merge is not a deploy</text><text class="s" x="942.5" y="658" font-size="17" font-weight="700" fill="#e8eef5" text-anchor="start">Production</text><text class="s" x="942.5" y="677" font-size="13.5" fill="#93a6b9" text-anchor="start">answers which commit it runs</text><text class="s" x="942.5" y="694" font-size="13.5" fill="#93a6b9" text-anchor="start">and serves what the change added</text><text class="s" x="569.4" y="109.6" font-size="17" font-weight="700" fill="#e8eef5" text-anchor="end">Asked by</text><text class="s" x="569.4" y="128.6" font-size="13.5" fill="#93a6b9" text-anchor="end">agents, CI and people,</text><text class="s" x="569.4" y="145.6" font-size="13.5" fill="#93a6b9" text-anchor="end">through the CLI, MCP or the Action</text><text class="s" x="907.9" y="181.6" font-size="17" font-weight="700" fill="#e8eef5" text-anchor="start">seamkit core</text><text class="s" x="907.9" y="200.6" font-size="13.5" fill="#93a6b9" text-anchor="start">deterministic, no model inside</text><text class="s" x="907.9" y="217.6" font-size="13.5" fill="#93a6b9" text-anchor="start">reads git and production, GET only</text><text class="s" x="1250.8" y="574" font-size="17" font-weight="700" fill="#e8eef5" text-anchor="end">Three answers</text><text class="s" x="1250.8" y="593" font-size="13.5" fill="#93a6b9" text-anchor="end">an exit code, a check run, and a</text><text class="s" x="1250.8" y="610" font-size="13.5" fill="#93a6b9" text-anchor="end">ledger that replays byte for byte</text></svg>
