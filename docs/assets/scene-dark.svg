<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img" aria-labelledby="t d"><title id="t">How seamkit sits beside your pipeline</title><desc id="d">An isometric scene in two rows. In the front row is your pipeline: a repository holding a stack of merged pull requests and a scope card; a bridge across a gap, the seam, where a press stamps each build with a version document; and production, a tower that answers /version. In the back row is seamkit: agents, CI and people ask; the core, a tower with a lens and no model inside, reads the repository and production over two dashed read-only beams; and it gives three answers: an exit code, a check run, and a ledger of stacked blocks that replays byte for byte.</desc><style>
.s{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif}
.m{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono","DejaVu Sans Mono",monospace}
.flow{animation:flow 1.1s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.blink{animation:blink 5s steps(1) infinite}
.belt{animation:belt 3.2s linear infinite}
.press{animation:press 3.2s ease-in-out infinite}
.drop{animation:drop 4.8s ease-in infinite}
@keyframes flow{to{stroke-dashoffset:-14}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.72)}}
@keyframes blink{0%,60%{opacity:1}61%,74%{opacity:.25}75%,100%{opacity:1}}
@keyframes belt{from{transform:translate(0,0)}to{transform:translate(65.1px,37.6px)}}
@keyframes press{0%,18%,60%,100%{transform:translateY(0)}32%,44%{transform:translateY(17px)}}
@keyframes drop{0%{transform:translateY(-38px);opacity:0}18%{opacity:1}30%,100%{transform:translateY(0);opacity:1}}
