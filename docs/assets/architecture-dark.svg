<text x="657" y="514" font-size="12.6"><tspan class="s" fill="#9aa9b7">content-addressed, SHA-256</tspan></text>
<text x="657" y="534" font-size="12.6"><tspan class="s" fill="#9aa9b7">replayable byte for byte</tspan></text>
