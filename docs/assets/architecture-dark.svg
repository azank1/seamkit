<text x="386" y="452" font-size="14"><tspan class="s" fill="#e4ebf1" font-weight="700">check run</tspan></text>
<text x="386" y="473" font-size="13"><tspan class="s" fill="#e4ebf1">on the deployed commit</tspan></text>
<text x="386" y="494" font-size="12.6"><tspan class="s" fill="#9aa9b7">GitHub Action, one per deploy</tspan></text>
<text x="386" y="514" font-size="12.6"><tspan class="s" fill="#9aa9b7">and on a scheduled watch</tspan></text>
<text x="386" y="534" font-size="12.6"><tspan class="s" fill="#9aa9b7">success only on a pass</tspan></text>
