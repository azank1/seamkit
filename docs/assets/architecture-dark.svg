<text x="460.0" y="303" font-size="19" text-anchor="middle"><tspan class="s" fill="#e4ebf1" font-weight="700">seamkit</tspan></text>
<text x="460.0" y="325" font-size="13" text-anchor="middle"><tspan class="s" fill="#9aa9b7">deterministic core, no model</tspan></text>
<text x="460.0" y="347" font-size="12.6" text-anchor="middle"><tspan class="s" fill="#9aa9b7">CLI (</tspan><tspan class="m" fill="#e4ebf1">npx seamkit</tspan><tspan class="s" fill="#9aa9b7">) and GitHub Action</tspan></text>
