<svg xmlns="http://www.w3.org/2000/svg" width="920" height="648" viewBox="0 0 920 648" role="img" aria-labelledby="t d"><title id="t">The seam between merged and live</title><desc id="d">Merged changes in git, carrying an optional seamkit-card, go through a build where seamkit stamp writes /version.json, then a deploy on any host, then production. seamkit reads git history and production (the version document and the served bundle text) read-only, never writes to production, and emits three outputs: an exit code (0 pass, 1 fail, 3 examined nothing, 4 unclassified (reserved; planned, no built check returns it yet)) for agents and scripts, a check run on the deployed commit from the GitHub Action, and a ledger on the seamkit/state branch that is content-addressed, replayable, and read by the next run. Agents, CI and humans all call the same CLI and Action.</desc><style>.s{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif}.m{font-family:ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", "DejaVu Sans Mono", monospace}</style><defs><marker id="ah-ink2" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#9aa9b7"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#84a5ff"/></marker></defs>
<text x="24" y="38" font-size="21"><tspan class="s" fill="#e4ebf1" font-weight="700">The seam between merged and live</tspan></text>
<text x="24" y="61" font-size="13.5"><tspan class="s" fill="#9aa9b7">seamkit reads production back, compares it with git history, and answers with an exit code.</tspan></text>
<text x="122.5" y="90" font-size="12.6" text-anchor="middle"><tspan class="m" fill="#9aa9b7">merged</tspan></text>
<text x="797.5" y="90" font-size="12.6" text-anchor="middle"><tspan class="m" fill="#9aa9b7">live</tspan></text>
<path d="M255,100 V94 H665 V100" fill="none" stroke="#26343f" stroke-width="1.5" stroke-linejoin="round"/>
<text x="460.0" y="89" font-size="12.6" text-anchor="middle"><tspan class="m" fill="#9aa9b7">the seam</tspan></text>
<rect x="24" y="106" width="197" height="88" rx="8" fill="#141e28" stroke="#26343f" stroke-width="1.5"/>
