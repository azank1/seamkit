<text x="40" y="130" font-size="14"><tspan class="s" fill="#e4ebf1" font-weight="700">git</tspan></text>
<text x="40" y="154" font-size="13"><tspan class="s" fill="#e4ebf1">merged changes</tspan></text>
<text x="40" y="174" font-size="12.6"><tspan class="s" fill="#9aa9b7">+ </tspan><tspan class="m" fill="#9aa9b7">seamkit-card</tspan><tspan class="s" fill="#9aa9b7"> in the PR</tspan></text>
<text x="265" y="130" font-size="14"><tspan class="s" fill="#e4ebf1" font-weight="700">build</tspan></text>
<text x="265" y="154" font-size="13"><tspan class="m" fill="#e4ebf1">seamkit stamp</tspan></text>
<text x="265" y="174" font-size="12.6"><tspan class="s" fill="#9aa9b7">writes </tspan><tspan class="m" fill="#9aa9b7">/version.json</tspan></text>
<text x="490" y="130" font-size="14"><tspan class="s" fill="#e4ebf1" font-weight="700">deploy</tspan></text>
<text x="490" y="154" font-size="13"><tspan class="s" fill="#e4ebf1">your host</tspan></text>
<text x="490" y="174" font-size="12.6"><tspan class="s" fill="#9aa9b7">Vercel, or any host</tspan></text>
<text x="715" y="130" font-size="14"><tspan class="s" fill="#e4ebf1" font-weight="700">production</tspan></text>
